get:
  summary: Obtiener una lista de asistentes
  tags: [ Atendee ]

  responses:
    '200':
      description: Asistentes solicitados exitosamente
      content:
        application/json:
          example:
            message: "Libro leido exitosamente"
            data:
              id: 1
              fullName: "Rafael Gustavo"
              email: "rafael.ajuria@unitec.edu"
              ticketType: "VIP"
              createdAt: "2026-03-24T00:19:10.609Z"

    '204':
      description: No se encontraron asistentes
      content:
        application/json:
          example:
            error: "No se encontraron asistentes"

    '500':
      description: Error en la Base de Datos
      content:
        application/json:
          example:
            error: "Error en la Base de Datos"
